components:
  schemas:
    ActivityIn:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        venue_name:
          type: string
          maxLength: 200
          minLength: 1
          title: Venue Name
        venue_lat:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Venue Lat
        venue_lng:
          type: number
          maximum: 180.0
          minimum: -180.0
          title: Venue Lng
        radius_m:
          type: integer
          maximum: 5000.0
          minimum: 0.0
          title: Radius M
          default: 100
        venue_regions:
          items:
            $ref: '#/components/schemas/VenueRegionIn'
          type: array
          title: Venue Regions
        starts_at:
          type: string
          format: date-time
          title: Starts At
        ends_at:
          type: string
          format: date-time
          title: Ends At
        student_ids:
          items:
            type: string
          type: array
          maxItems: 500
          title: Student Ids
      type: object
      required:
      - name
      - venue_name
      - venue_lat
      - venue_lng
      - starts_at
      - ends_at
      title: ActivityIn
    ActivityList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ActivityOut'
          type: array
          title: Items
      type: object
      required:
      - items
      title: ActivityList
    ActivityOut:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        venue_name:
          type: string
          title: Venue Name
        venue_lat:
          type: number
          title: Venue Lat
        venue_lng:
          type: number
          title: Venue Lng
        radius_m:
          type: integer
          title: Radius M
        venue_regions:
          items:
            $ref: '#/components/schemas/VenueRegionOut'
          type: array
          title: Venue Regions
        starts_at:
          type: string
          title: Starts At
        ends_at:
          type: string
          title: Ends At
        created_by:
          type: string
          title: Created By
        roster_count:
          type: integer
          title: Roster Count
        checkpoint_windows:
          items:
            $ref: '#/components/schemas/CheckpointWindowOut'
          type: array
          title: Checkpoint Windows
        open_checkpoint:
          anyOf:
          - $ref: '#/components/schemas/CheckpointWindowOut'
          - type: 'null'
        my_attendance:
          anyOf:
          - $ref: '#/components/schemas/AttendanceRecordOut'
          - type: 'null'
      type: object
      required:
      - id
      - name
      - venue_name
      - venue_lat
      - venue_lng
      - radius_m
      - starts_at
      - ends_at
      - created_by
      - roster_count
      - checkpoint_windows
      - open_checkpoint
      - my_attendance
      title: ActivityOut
    ApproveIn:
      properties:
        identity_confirmed:
          type: boolean
          title: Identity Confirmed
      type: object
      required:
      - identity_confirmed
      title: ApproveIn
    AttemptIn:
      properties:
        action:
          type: string
          enum:
          - check_in
          - checkpoint
          - check_out
          title: Action
      type: object
      required:
      - action
      title: AttemptIn
    AttemptOut:
      properties:
        id:
          type: string
          title: Id
        activity_id:
          type: string
          title: Activity Id
        action:
          type: string
          enum:
          - check_in
          - checkpoint
          - check_out
          title: Action
        created_at:
          type: string
          title: Created At
        expires_at:
          type: string
          title: Expires At
        checkpoint_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Checkpoint Id
        nonce:
          type: string
          title: Nonce
        challenge:
          type: string
          enum:
          - left
          - right
          title: Challenge
      type: object
      required:
      - id
      - activity_id
      - action
      - created_at
      - expires_at
      - checkpoint_id
      - nonce
      - challenge
      title: AttemptOut
    AttendanceEventOut:
      properties:
        id:
          type: string
          title: Id
        attempt_id:
          type: string
          title: Attempt Id
        activity_id:
          type: string
          title: Activity Id
        student_id:
          type: string
          title: Student Id
        action:
          type: string
          enum:
          - check_in
          - checkpoint
          - check_out
          title: Action
        status:
          type: string
          enum:
          - recorded
          - needs_review
          title: Status
        received_at:
          type: string
          title: Received At
        checkpoint_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Checkpoint Id
        review_reasons:
          items:
            type: string
          type: array
          title: Review Reasons
        location:
          $ref: '#/components/schemas/LocationOut'
        face:
          $ref: '#/components/schemas/FaceOut'
      type: object
      required:
      - id
      - attempt_id
      - activity_id
      - student_id
      - action
      - status
      - received_at
      - checkpoint_id
      - review_reasons
      - location
      - face
      title: AttendanceEventOut
    AttendanceList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AttendanceRecordOut'
          type: array
          title: Items
      type: object
      required:
      - items
      title: AttendanceList
    AttendanceRecordOut:
      properties:
        activity_id:
          type: string
          title: Activity Id
        activity_name:
          type: string
          title: Activity Name
