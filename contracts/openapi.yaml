        '422':
          description: validation_error, unusable_capture, multiple_faces, location_stale,
            device_key_required, face_not_matched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '401':
          description: not_authenticated or invalid_credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '403':
          description: forbidden, not_assigned, device_mismatch, device_taken or bad_signature
